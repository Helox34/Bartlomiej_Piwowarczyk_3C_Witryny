<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Galeria</title>
<style>
  body {
    background-color: #333;
    color: white;
    font-family: Arial, sans-serif;
  }

  fieldset {
    border: 2px solid #888;
  }

  legend {
    color: white;
    font-weight: bold;
  }

  .gallery-img {
    width: 300px;
    height: 200px;
    border: 2px solid #555;
    margin: 9px;
    transition: transform 1s;
    display: inline-block;
    vertical-align: top;
    object-fit: cover;
  }

  .gallery-img:hover {
    transform: scale(1.2);
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>Galeria</h1>
  
  <fieldset>
    <legend>Dokąd tupta nocą jeż</legend>

   <a href="everest.jpg"> <img src="everest300x200.jpg"  class="gallery-img" /> </a>
   <a href="jezioro.jpg"> <img src="jezioro300x200.jpg"  class="gallery-img" /> </a>
   <a href="zorza.jpg"> <img src="zorza300x200.jpg"  class="gallery-img" /> </a>
   <a href="wodospad.jpg">  <img src="wodospad300x200.jpg"  class="gallery-img" /> </a>
  </fieldset>
</body>
</html>
