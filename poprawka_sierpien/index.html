<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Poprawka — Kontakt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Projekt — formularz kontaktowy</h1>
    <p>Przykładowy prosty projekt do ćwiczeń przed poprawką.</p>
  </header>

  <main>
    <form id="contactForm" action="save.php" method="post" novalidate>
      <label>Imię i nazwisko
        <input type="text" name="name" id="name" required>
      </label>

      <label>Adres e-mail
        <input type="email" name="email" id="email" required>
      </label>

      <label>Wiadomość
        <textarea name="message" id="message" rows="6" required></textarea>
      </label>

      <div class="actions">
        <button type="submit">Wyślij</button>
      </div>
      <div id="errors" aria-live="polite"></div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
