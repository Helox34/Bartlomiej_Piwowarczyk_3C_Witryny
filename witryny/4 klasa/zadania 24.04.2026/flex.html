<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona z Flexbox</title>
    <link rel="stylesheet" href="flex.css">
</head>
<body>

    <header class="naglowek">
        <h1>Nagłówek strony</h1>
    </header>

    <main class="kontener-flex">
        <div class="element-flex">
            <h2>Flex 1</h2>
            <p>To jest pierwsza z trzech kolumn opartych na modelu Flexbox.</p>
        </div>
        <div class="element-flex">
            <h2>Flex 2</h2>
            <p>To jest druga z trzech kolumn opartych na modelu Flexbox.</p>
        </div>
        <div class="element-flex">
            <h2>Flex 3</h2>
            <p>To jest trzecia z trzech kolumn opartych na modelu Flexbox.</p>
        </div>
    </main>

    <footer class="stopka">
        <p>Stopka strony</p>
    </footer>

</body>
</html>
