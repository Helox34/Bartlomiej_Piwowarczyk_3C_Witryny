<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zboza w Polsce</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            border: 3px dotted rgb(255, 115, 0);
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <table>
        <caption>zboza uprawne w Polsce</caption>
        <tr>
            <th>pszenica</th>
            <th>pszenżyto</th>
            <th>jęczmień</th>
            <th>żyto</th>
            <th>owies</th>
        </tr>
        <tr>
            <td>32%</td>
            <td>19%</td>
            <td>12%</td>
            <td>11%</td>
            <td>6%</td>
        </tr>
    </table>
</body>
</html>
