<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zadanie_galeria</title>
</head>
<style>
body {
      font-family: Verdana, sans-serif;
    }

    .galeria {
      display: flex;
      gap: 5px;
    }

    figure {
      width: 180px;
      height: 180px;
      border: 1px solid #ccc;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: all 0.3s;
    }

    figure:hover {
      border-color: #777;
      background-color: aliceblue;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
    }

    figcaption {
      font-size: small;
      padding: 15px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="galeria">
    <figure>
      <a href="obraz1.jpg" target="_blank">
        <img src="mini1.jpg" alt="Kielecka Kadzielnia">
      </a>
      <figcaption>Kielecka Kadzielnia</figcaption>
    </figure>
    <figure>
      <a href="obraz2.jpg" target="_blank">
        <img src="mini2.jpg" alt="Góry Świętokrzyskie">
      </a>
      <figcaption>Góry Świętokrzyskie</figcaption>
    </figure>
    <figure>
      <a href="obraz3.jpg" target="_blank">
        <img src="mini3.jpg" alt="Cedzyna">
      </a>
      <figcaption>Cedzyna</figcaption>
    </figure>
    <figure>
      <a href="obraz4.jpg" target="_blank">
        <img src="mini4.jpg" alt="Zalew Kielecki">
      </a>
      <figcaption>Zalew Kielecki</figcaption>
    </figure>
  </div>
</body>
</html>
